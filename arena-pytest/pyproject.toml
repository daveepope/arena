[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-pytest"
dynamic = ["version"]
description = "pytest API and fixtures for Arena (via the C FFI)"
readme = "DESCRIPTION.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "The Arena Authors" }]
keywords = ["arena", "pytest", "plugin", "testing", "ffi", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.28.0",
    "kafka-python-ng>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/daveepope/arena"
Repository = "https://github.com/daveepope/arena"
Issues = "https://github.com/daveepope/arena/issues"
Changelog = "https://github.com/daveepope/arena/releases"

[project.optional-dependencies]
dev = []

[tool.setuptools.dynamic]
version = { file = "../VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arena_pytest*"]

[project.entry-points."pytest11"]
arena_pytest = "arena_pytest.arena"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-s"
