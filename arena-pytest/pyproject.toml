[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-pytest"
version = "0.1.0-alpha.1"
description = "pytest API and fixtures for Arena (via the C FFI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.28.0",
    "kafka-python-ng>=2.0.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["arena_pytest*"]

[project.entry-points."pytest11"]
arena_pytest = "arena_pytest.arena"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-s"
log_cli = true
log_cli_level = "INFO"
