[package]
name = "arena-profile"
version.workspace = true
edition = "2021"
authors = ["David Pope"]
description = "CPU profiling for Arena-managed processes: attaches a per-runtime external sampler and reports captured samples through the Arena lifecycle."
license = "todo"

[lib]
path = "src/lib.rs"

[dependencies]
arena = { workspace = true }
inferno = { workspace = true }
runfiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
