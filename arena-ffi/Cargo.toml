[package]
name = "arena-ffi"
version.workspace = true
edition = "2021"
description = "C FFI layer for the Arena framework"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bench-support = []

[[test]]
name = "ffi_healthcheck_test"
path = "tests/unit/healthcheck_test.rs"

[[test]]
name = "ffi_containerized_component_test"
path = "tests/component/containerized/containerized_component_test.rs"

