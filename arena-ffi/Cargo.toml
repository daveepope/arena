[package]
name = "arena-ffi"
version.workspace = true
edition = "2021"
description = "C FFI layer for the Arena framework"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arena = { workspace = true }
async-trait = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
arena-container-component = { workspace = true }
arena-executable-component = { workspace = true }
arena-kafka = { workspace = true }
arena-postgres = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
