path = "tests/unit/dependency/http/http_mapping_spec.rs"

[[test]]
name = "ffi_playbook_validation_test"
path = "tests/unit/dependency/http/http_playbook_ffi_validation.rs"

[[test]]
name = "ffi_mssql_dependency_test"
