[package]
name = "arena-ffi"
version.workspace = true
edition = "2021"
description = "C FFI layer for the Arena framework"

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "ffi_test"
path = "tests/lifecycle/open_close_dependency_reset.rs"

[[test]]
name = "ffi_logging_test"
path = "tests/logging/logging_ffi_callbacks.rs"

[[test]]
name = "ffi_temporal_dependency_test"
path = "tests/dependency/temporal/temporal_dependency_test.rs"

[[test]]
name = "ffi_smtp_dependency_test"
path = "tests/dependency/smtp/smtp_dependency_test.rs"

[dependencies]
arc-swap = { workspace = true }
arena = { workspace = true }
arena-http = { workspace = true }
async-trait = { workspace = true }
arena-containerized-component = { workspace = true }
arena-executable-component = { workspace = true }
arena-kafka = { workspace = true }
arena-localstack = { workspace = true }
arena-postgres = { workspace = true }
arena-mssql = { workspace = true }
arena-oauth = { workspace = true }
arena-temporal = { workspace = true }
arena-smtp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
