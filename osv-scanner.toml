reason = "braces 3.0.3 stack-exhaustion DoS via deeply nested glob patterns. No fixed release exists upstream (OSV lists no fixed version). Transitive dev dependency of the dashboard's test/build toolchain; patterns it processes come from our own fixed source globs in BUILD/vite config, not external input."
