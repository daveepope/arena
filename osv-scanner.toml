[[IgnoredVulns]]
id = "PYSEC-2026-4146"
reason = "PyJWT decode() options-dict mutation enabling claim-verification bypass, but only when caller code reuses the same options dict object across a verify_signature=False call and a later verify_signature=True call. examples/src/example_readings_fastapi_web_app/app.py always passes a fresh options={\"verify_aud\": False} literal per call and never sets verify_signature=False, so the vulnerable reuse pattern cannot occur. No fixed PyJWT release exists yet."

[[IgnoredVulns]]
