[advisories]
ignore = [
    # rsa 0.9.10 Marvin Attack timing side-channel (arena-oauth, jsonwebtoken).
    # No fixed release exists upstream. Usage is local RSA keypair generation and
    # JWT signing/verification against ephemeral test credentials, not decryption
    # of attacker-supplied ciphertext over an untrusted network.
    "RUSTSEC-2023-0071",

    # rustls-webpki 0.101.7 name-constraint / CRL-parsing bugs, pulled in via
    # tiberius 0.12.3 (arena-mssql). tiberius has no released or unreleased fix
    # (checked prisma/tiberius main branch); the only available workaround is
    # switching tiberius's TLS backend from rustls to native-tls, which trades
    # this for a hard runtime dependency on system OpenSSL. Arena's MSSQL
    # connections are to ephemeral, self-hosted containers on a local/Docker
    # network, not exposed to an untrusted network path, so exploitability here
    # is low. Revisit if tiberius publishes a fix.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # rustls-pemfile 1.0.4 unmaintained warning, same tiberius 0.12.3 chain as above.
    "RUSTSEC-2025-0134",

    # rustls 0.21.12 `Debug` impls on client session values expose the TLS 1.2
    # master secret / TLS 1.3 resumption PSK, and a pre-authentication record of
    # the server-selected key exchange group allows a downgrade to classical key
    # exchange. Both are fixed in rustls 0.23.46, which the workspace already
    # uses directly; the 0.21.12 copy is the same tiberius 0.12.3 chain as above
    # and cannot reach 0.23.x. tiberius 0.13.0 does drop this chain, but its
    # rustls feature forces the aws-lc-rs provider, adding a cmake/C build on
    # every platform, so that bump is deferred. Arena implements no
    # ClientSessionStore and never debug-formats session values, and MSSQL
    # connections are to ephemeral local containers. Note these IDs also cover
    # rustls 0.23.x, so re-check that the direct pin stays at or above 0.23.46.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",

    # rustls-webpki may accept certificate paths containing distrusted emSign
    # intermediate public keys. Fixed in 0.103.16, which the workspace already
    # uses directly; the remaining 0.101.7 copy is the same tiberius 0.12.3
    # chain as above and has no fix on the 0.101 line. Arena's MSSQL
    # connections are to ephemeral local containers, not to public certificate
    # authorities. Note this ID also covers rustls-webpki 0.103.x, so re-check
    # that the direct pin stays at or above 0.103.16.
    "RUSTSEC-2026-0382",

    # TEMPORARY, remove in the release after 7.0.2.
    # ctutils 0.4.2 generates non-constant-time masks on some platforms, a
    # timing side-channel reached only through digest -> hmac -> aws-sigv4 ->
    # the AWS SDK in arena-localstack, which signs requests to ephemeral local
    # containers rather than to an attacker-observable network path. A fix
    # exists in 0.4.4, but it was published on 2026-10-22 and so sits inside
    # the 3-day ARENA_MIN_RELEASE_AGE_DAYS floor; 7.0.2 ships the other 248
    # alert fixes now rather than waiting. Bump ctutils and delete this entry
    # once 0.4.4 is older than three days.
    "RUSTSEC-2026-0385",
    # crypto-bigint 0.5.5 has multiple timing-variability issues in operations
    # intended to be constant time. Fixed in 0.7.6, which nothing in this tree
    # can reach: the crate arrives only through jsonwebtoken's rust_crypto
    # feature -> p256/p384 0.13 -> elliptic-curve 0.13.8, and jsonwebtoken
    # 11.1.0, the latest release, still pins p256 ^0.13.2. The alternative is
    # jsonwebtoken's aws_lc_rs backend, which forces a cmake/C build on every
    # platform. Arena's use is local ECDSA keypair generation and JWT
    # signing/verification against ephemeral test credentials in arena-oauth,
    # not an operation an attacker can time. Remove this entry once
    # jsonwebtoken adopts p256 0.14.
    "RUSTSEC-2026-0387",
]
