[package]
name = "arena-container"
version.workspace = true
edition = "2021"
authors = ["David Pope"]
description = "Shared container utilities for Arena modules that manage containers (networking, lifecycle helpers, etc.)."
license = "todo"

[lib]
path = "src/lib.rs"

[dependencies]
bollard = { workspace = true }
tar = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
