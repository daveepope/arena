[package]
name = "arena-examples"
version.workspace = true
edition = "2021"
authors = ["David Pope"]
description = "Examples using the arena framework. Intended as documentation and testing."
license = "todo"

[lib]
name = "arena_examples"
path = "src/lib.rs"

[[bin]]
name = "example-console"
path = "src/example-console/main.rs"

[[bin]]
name = "example-readings-axum-web-app"
path = "src/example_readings_axum_web_app/web_server/main.rs"

[dependencies]
arena = { workspace = true }
arena-kafka = { workspace = true }
arena-postgres = { workspace = true }
arena-mssql = { workspace = true }
arena-http = { workspace = true }
arena-oauth = { workspace = true }
arena-executable-component = { workspace = true }
arena-containerized-component = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-postgres = { workspace = true }
rdkafka = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }

[[test]]
name = "example-axum-component-test"
path = "tests/example-axum-component-test/axum_component_test.rs"

[dev-dependencies]
ctor = { workspace = true }