name: OSV-Scanner

on:
  pull_request:
    branches: [ "master" ]
  merge_group:
    branches: [ "master" ]
  schedule:
    - cron: '17 6 * * 3'
  push:
    branches: [ "master" ]

permissions: read-all

jobs:
  scan-full:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      fail-on-vuln: true
      scan-args: |-
        -r
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      fail-on-vuln: true
      scan-args: |-
        -r
        ./
