name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Arena CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Run all tests
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: bazel test //... --test_output=all

      - name: Run tests (excluding Docker)
        if: runner.os == 'macOS'
        run: bazel test //... --test_tag_filters=-local --test_output=all
