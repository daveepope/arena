name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: build-test-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.filter.outputs.bazel }}
      publishable: ${{ steps.filter.outputs.publishable }}
      version_changed: ${{ steps.filter.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bazel:
              - '**/*'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.cursor/**'
            publishable:
              - '**/*'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.cursor/**'
              - '!.github/**'
              - '!.gitignore'
              - '!.gitattributes'
              - '!.editorconfig'
              - '!.idea/**'
              - '!.vscode/**'
              - '!.dockerignore'
              - '!.bazelignore'
              - '!.codecov.yml'
              - '!LICENSE'
              - '!**/*.png'
            version_changed:
              - 'VERSION'

  docs_only:
    name: Docs / agent rules only
    needs: changes
    if: needs.changes.outputs.bazel != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "No Bazel-relevant changes; build and test skipped."

  require_version_bump:
    name: Require VERSION bump (same-repo PR)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        needs.changes.outputs.version_changed == 'true' ||
        needs.changes.outputs.publishable == 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Require VERSION bump for publishable changes
        env:
          ARENA_VERSION_BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py

  master_merge_guard:
    name: Guard master publish path
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.bazel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      from_merged_pr: ${{ steps.guard.outputs.from_merged_pr }}
    steps:
      - uses: actions/github-script@v7
        id: guard
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = data.some((pr) => pr.merged_at);
            core.setOutput("from_merged_pr", merged ? "true" : "false");
            if (!merged) {
              core.warning(
                "Direct push to master: full CI is required before publish. Open a pull request to use the fast publish path."
              );
            }

  full_ci:
    name: Full CI gate
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() && !failure() &&
      needs.changes.outputs.bazel == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped'
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.master_merge_guard.outputs.from_merged_pr != 'true'
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "Full build and test required."

  verify:
    name: Verify (Ubuntu 24.04)
    needs: [changes, full_ci]
    if: needs.full_ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            rust_crates:
              - 'Cargo.toml'
              - 'Cargo.Bazel.lock'
              - '**/Cargo.toml'
              - 'MODULE.bazel'
            version_file:
              - 'VERSION'
            deps:
              - 'Cargo.Bazel.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/requirements_lock.txt'
              - '**/requirements.txt'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Verify VERSION sync
        run: >-
          bazel test //scripts:version_sync_test //scripts:arena_version_test
          //scripts:check_version_bump_test --config=ci

      - name: Check release lockfiles match VERSION
        if: steps.paths.outputs.version_file == 'true'
        run: python3 scripts/check_release_lockfiles.py

      - name: Verify lockfiles
        if: >-
          steps.paths.outputs.rust_crates == 'true' ||
          steps.paths.outputs.version_file == 'true'
        run: |
          CARGO_BAZEL_REPIN=1 bazel build //... --config=ci
          bazel mod deps --lockfile_mode=update
          if ! git diff --quiet Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock; then
            echo "Lockfiles are out of date. Run: CARGO_BAZEL_REPIN=1 bazel build //... && bazel mod deps --lockfile_mode=update"
            git diff Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock
            exit 1
          fi

      - name: Check dependency release age
        if: steps.paths.outputs.deps == 'true'
        env:
          ARENA_DEP_AGE_BASE_REF: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '')
            }}
        run: |
          bazel test //scripts:dependency_release_age_parse_test --config=ci
          bazel run //scripts:check_dependency_release_age --config=ci

  test_ubuntu_24_04:
    name: Test Ubuntu 24.04
    needs: [changes, full_ci]
    if: needs.full_ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  coverage_ubuntu_24_04:
    name: Coverage Ubuntu 24.04
    needs: [changes, full_ci]
    if: needs.full_ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Coverage
        run: |
          bazel coverage //... --config=coverage --build_tests_only --test_tag_filters=-component_test
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ubuntu-24.04
          name: arena-ubuntu-24.04
          fail_ci_if_error: false

  test_macos_intel:
    name: Test macOS Intel
    needs: [changes, full_ci]
    if: needs.full_ci.result == 'success'
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Colima
        uses: douglascamata/setup-docker-macos-action@v1.1.0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-intel
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  test_macos_arm64:
    name: Test macOS ARM64
    needs: [changes, full_ci]
    if: needs.full_ci.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-arm64
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test

  wheel:
    name: Build wheel (${{ matrix.runs-on }})
    needs:
      - changes
      - master_merge_guard
      - require_version_bump
      - verify
      - test_ubuntu_24_04
      - test_macos_intel
      - test_macos_arm64
    if: >-
      always() && !cancelled() && !failure() &&
      needs.changes.outputs.bazel == 'true' &&
      needs.changes.outputs.version_changed == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.require_version_bump.result == 'success' &&
          needs.verify.result == 'success' &&
          needs.test_ubuntu_24_04.result == 'success' &&
          needs.test_macos_intel.result == 'success' &&
          needs.test_macos_arm64.result == 'success'
        ) ||
        (
          github.event_name == 'push' &&
          (
            needs.master_merge_guard.outputs.from_merged_pr == 'true' ||
            (
              needs.verify.result == 'success' &&
              needs.test_ubuntu_24_04.result == 'success' &&
              needs.test_macos_intel.result == 'success' &&
              needs.test_macos_arm64.result == 'success'
            )
          )
        )
      )
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            artifact: arena-pytest-wheel-ubuntu-24.04
            disk-cache: build-test-publish-arena-ubuntu-24.04
          - runs-on: macos-latest
            artifact: arena-pytest-wheel-macos-arm64
            disk-cache: build-test-publish-arena-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.disk-cache }}
          repository-cache: true

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib

          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          version_file = pathlib.Path("VERSION")
          base = version_file.read_text().strip()
          unique = f"{base}.dev{run_id}"
          version_file.write_text(unique + "\n")
          print(f"Patched VERSION to {unique} (TestPyPI)")
          PY

      - name: Build wheel
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:arena_pytest_wheel --config=ci
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish TestPyPI (Ubuntu 24.04)
    needs: wheel
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.wheel.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish PyPI (Ubuntu 24.04)
    needs: [changes, wheel]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.version_changed == 'true' &&
      needs.wheel.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true
