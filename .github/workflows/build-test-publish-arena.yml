name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: build-test-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.filter.outputs.bazel }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bazel:
              - '**/*'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.cursor/**'

  docs_only:
    name: Docs / agent rules only
    needs: changes
    if: needs.changes.outputs.bazel != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "No Bazel-relevant changes; build and test skipped."

  release_head:
    name: Release HEAD check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_only: ${{ steps.check.outputs.version_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - id: check
        run: |
          if [ "$(git log -1 --format=%s)" = "chore: bump release VERSION for master" ]; then
            echo "version_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_only=false" >> "$GITHUB_OUTPUT"
          fi

  bump_release_version:
    name: Bump release VERSION (PR)
    needs: [release_head]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.bump.outputs.version_changed }}
      artifact_ready: ${{ steps.upload.outputs.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch master
        run: git fetch origin master

      - name: Bump VERSION from master
        id: bump
        run: |
          python3 scripts/bump_release_version.py
          if git diff --quiet VERSION Cargo.toml MODULE.bazel; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release version files
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: arena-release-version
          path: |
            VERSION
            Cargo.toml
            MODULE.bazel
          if-no-files-found: error

  repin_release_locks:
    name: Repin lockfiles after version bump (PR)
    needs: [release_head, bump_release_version]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      needs.bump_release_version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.upload.outputs.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: arena-release-version

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Repin after version bump
        run: |
          CARGO_BAZEL_REPIN=1 bazel build //...
          bazel mod deps --lockfile_mode=update

      - name: Upload repinned lockfiles
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: arena-release-lockfiles
          path: |
            Cargo.Bazel.lock
            Cargo.lock
            MODULE.bazel.lock
          if-no-files-found: error

  verify_cargo_bazel_lock:
    name: Verify Cargo.Bazel.lock (Ubuntu 24.04)
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - uses: dorny/paths-filter@v3
        id: rust_crates
        with:
          filters: |
            rust_crates:
              - 'Cargo.toml'
              - 'Cargo.Bazel.lock'
              - '**/Cargo.toml'
              - 'MODULE.bazel'

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Verify VERSION sync
        run: bazel test //scripts:version_sync_test //scripts:arena_version_test --config=ci

      - name: Verify lockfiles
        if: steps.rust_crates.outputs.rust_crates == 'true'
        run: |
          if [ "${{ needs.bump_release_version.outputs.version_changed }}" = "true" ]; then
            bazel build //... --config=ci
          else
            CARGO_BAZEL_REPIN=1 bazel build //...
            bazel mod deps --lockfile_mode=update
            if ! git diff --quiet Cargo.Bazel.lock MODULE.bazel.lock; then
              echo "Lockfiles are out of date. Run: CARGO_BAZEL_REPIN=1 bazel build //... && bazel mod deps --lockfile_mode=update"
              git diff Cargo.Bazel.lock MODULE.bazel.lock
              exit 1
            fi
          fi

  verify_dependency_release_age:
    name: Verify dependency release age (Ubuntu 24.04)
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - uses: dorny/paths-filter@v3
        id: dep_files
        with:
          filters: |
            deps:
              - 'Cargo.Bazel.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/requirements_lock.txt'
              - '**/requirements.txt'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'

      - name: Setup Bazel
        if: steps.dep_files.outputs.deps == 'true'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Check dependency release age
        if: steps.dep_files.outputs.deps == 'true'
        env:
          ARENA_DEP_AGE_BASE_REF: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '')
            }}
        run: |
          bazel test //scripts:dependency_release_age_parse_test --config=ci
          bazel run //scripts:check_dependency_release_age --config=ci

  test_ubuntu_24_04:
    name: Test Ubuntu 24.04
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  coverage_ubuntu_24_04:
    name: Coverage Ubuntu 24.04
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Coverage
        run: |
          bazel coverage //... --config=coverage --build_tests_only --test_tag_filters=-component_test
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ubuntu-24.04
          name: arena-ubuntu-24.04
          fail_ci_if_error: false

  test_macos_intel:
    name: Test macOS Intel
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - name: Setup Colima
        uses: douglascamata/setup-docker-macos-action@v1.1.0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-intel
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  test_macos_arm64:
    name: Test macOS ARM64
    needs: [changes, release_head, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped')
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-arm64
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test

  wheel:
    name: Build wheel (${{ matrix.runs-on }})
    needs: [changes, release_head, bump_release_version, repin_release_locks, test_ubuntu_24_04, test_macos_intel, test_macos_arm64]
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.test_ubuntu_24_04.result == 'success' &&
      needs.test_macos_intel.result == 'success' &&
      needs.test_macos_arm64.result == 'success' &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.release_head.result == 'skipped' || needs.release_head.outputs.version_only != 'true') &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
      (needs.repin_release_locks.result == 'success' || needs.repin_release_locks.result == 'skipped') &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master'
        )
      )
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            artifact: arena-pytest-wheel-ubuntu-24.04
            disk-cache: build-test-publish-arena-ubuntu-24.04
          - runs-on: macos-latest
            artifact: arena-pytest-wheel-macos-arm64
            disk-cache: build-test-publish-arena-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.artifact_ready == 'true'
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        if: needs.bump_release_version.outputs.version_changed == 'true'
        with:
          name: arena-release-lockfiles

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.disk-cache }}
          repository-cache: true

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib

          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          version_file = pathlib.Path("VERSION")
          base = version_file.read_text().strip()
          unique = f"{base}.dev{run_id}"
          version_file.write_text(unique + "\n")
          print(f"Patched VERSION to {unique} (TestPyPI)")
          PY
          bazel run //scripts:sync_version --config=ci
          bazel shutdown

      - name: Build wheel
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:arena_pytest_wheel --config=ci
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  commit_release_version:
    name: Commit release VERSION (PR)
    needs: [wheel, bump_release_version, repin_release_locks]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.bump_release_version.outputs.version_changed == 'true' &&
      needs.wheel.result == 'success' &&
      needs.repin_release_locks.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: arena-release-version

      - uses: actions/download-artifact@v4
        with:
          name: arena-release-lockfiles

      - name: Commit release version
        run: |
          if git diff --quiet VERSION Cargo.toml MODULE.bazel Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock; then
            echo "VERSION already on branch"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION Cargo.toml MODULE.bazel Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock
          git commit -m "chore: bump release VERSION for master"
          git push

  publish_testpypi:
    name: Publish TestPyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish PyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true
