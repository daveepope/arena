name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.filter.outputs.bazel }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bazel:
              - '**/*'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.cursor/**'

  docs_only:
    name: Docs / agent rules only
    needs: changes
    if: needs.changes.outputs.bazel != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "No Bazel-relevant changes; build and test skipped."

  verify_cargo_bazel_lock:
    name: Verify Cargo.Bazel.lock (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: rust_crates
        with:
          filters: |
            rust_crates:
              - 'Cargo.toml'
              - 'Cargo.Bazel.lock'
              - '**/Cargo.toml'
              - 'MODULE.bazel'

      - name: Setup Bazel
        if: steps.rust_crates.outputs.rust_crates == 'true'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Repin and verify lockfile
        if: steps.rust_crates.outputs.rust_crates == 'true'
        run: |
          CARGO_BAZEL_REPIN=1 bazel build //... --config=ci
          if ! git diff --quiet Cargo.Bazel.lock; then
            echo "Cargo.Bazel.lock is out of date. Run: CARGO_BAZEL_REPIN=1 bazel build //..."
            git diff Cargo.Bazel.lock
            exit 1
          fi

  verify_dependency_release_age:
    name: Verify dependency release age (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: dep_files
        with:
          filters: |
            deps:
              - 'Cargo.Bazel.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/requirements_lock.txt'
              - '**/requirements.txt'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'

      - name: Setup Bazel
        if: steps.dep_files.outputs.deps == 'true'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Check dependency release age
        if: steps.dep_files.outputs.deps == 'true'
        env:
          ARENA_DEP_AGE_BASE_REF: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '')
            }}
        run: |
          bazel test //scripts:dependency_release_age_parse_test --config=ci
          bazel run //scripts:check_dependency_release_age --config=ci

  test_ubuntu_24_04:
    name: Test Ubuntu 24.04
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  coverage_ubuntu_24_04:
    name: Coverage Ubuntu 24.04
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Coverage
        run: |
          bazel coverage //... --config=coverage --build_tests_only --test_tag_filters=-component_test
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ubuntu-24.04
          name: arena-ubuntu-24.04
          fail_ci_if_error: false

  test_macos_intel:
    name: Test macOS Intel
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Colima
        uses: douglascamata/setup-docker-macos-action@v1.1.0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-intel
          repository-cache: true

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  test_macos_arm64:
    name: Test macOS ARM64
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-arm64
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test

  wheel:
    name: Build wheel (${{ matrix.runs-on }})
    needs: [changes, test_ubuntu_24_04, test_macos_intel, test_macos_arm64]
    if: >-
      ${{
        needs.changes.outputs.bazel == 'true' &&
        (
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/master'
          )
        )
      }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            artifact: arena-pytest-wheel-ubuntu-24.04
            disk-cache: build-test-publish-arena-ubuntu-24.04
          - runs-on: macos-latest
            artifact: arena-pytest-wheel-macos-arm64
            disk-cache: build-test-publish-arena-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.disk-cache }}
          repository-cache: true

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib, re, tomllib

          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          pyproject = pathlib.Path("arena-pytest/pyproject.toml")
          data = tomllib.loads(pyproject.read_text())
          base = data["project"]["version"]
          unique = f"{base}.dev{run_id}"
          text = pyproject.read_text()
          text = re.sub(
              r'^version = "[^"]+"',
              f'version = "{unique}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(text)
          build = pathlib.Path("arena-pytest/BUILD").read_text()
          build = re.sub(
              r'ARENA_PYTEST_VERSION = "[^"]+"',
              f'ARENA_PYTEST_VERSION = "{unique}"',
              build,
              count=1,
          )
          pathlib.Path("arena-pytest/BUILD").write_text(build)
          print(f"Patched arena-pytest version to {unique} (TestPyPI)")
          PY

      - name: Build wheel
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:arena_pytest_wheel --config=ci
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish TestPyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish PyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true
