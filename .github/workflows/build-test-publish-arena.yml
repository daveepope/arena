name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: build-test-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      only_non_publishable: ${{ steps.classify.outputs.only_non_publishable }}
      has_publishable: ${{ steps.classify.outputs.has_publishable }}
      has_ci_relevant: ${{ steps.classify.outputs.has_ci_relevant }}
      version_changed: ${{ steps.filter.outputs.version_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          list-files: shell
          filters: |
            all_changed:
              - '**'
            version_changed:
              - 'VERSION'

      - name: Classify changed files
        id: classify
        env:
          CHANGED: ${{ steps.filter.outputs.all_changed_files }}
        run: |
          docs_path() {
            case "$1" in
              *.md|AGENTS.md|CLAUDE.md) return 0 ;;
              .gitignore|.gitattributes|.editorconfig|.dockerignore|.bazelignore) return 0 ;;
              .codecov.yml|LICENSE) return 0 ;;
              *.png) return 0 ;;
            esac
            [[ "$1" == .cursor/* || "$1" == .idea/* || "$1" == .vscode/* ]]
          }
          ci_only_path() {
            [[ "$1" == .github/workflows/* || "$1" == .github/dependabot.yml ]]
          }
          only_non_publishable=false
          has_publishable=false
          has_ci_relevant=false
          if [ -n "$CHANGED" ]; then
            only_non_publishable=true
            for path in $CHANGED; do
              if docs_path "$path"; then
                continue
              fi
              only_non_publishable=false
              has_ci_relevant=true
              if ci_only_path "$path"; then
                continue
              fi
              has_publishable=true
            done
          fi
          echo "only_non_publishable=${only_non_publishable}" >> "$GITHUB_OUTPUT"
          echo "has_publishable=${has_publishable}" >> "$GITHUB_OUTPUT"
          echo "has_ci_relevant=${has_ci_relevant}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED:-<none>}"
          echo "only_non_publishable=${only_non_publishable} has_publishable=${has_publishable} has_ci_relevant=${has_ci_relevant}"

  dependabot_awaiting_version_bump:
    name: Awaiting Dependabot version bump
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.changes.outputs.version_changed != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "Dependabot version bump runs first; build and test start after VERSION is pushed."

  docs_only:
    name: Docs / agent rules only
    needs: changes
    if: needs.changes.outputs.has_ci_relevant != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "No publishable changes; build and test skipped."

  non_publishable_only:
    name: Non-publishable changes only
    needs: changes
    if: >-
      needs.changes.outputs.has_ci_relevant != 'true' &&
      needs.changes.outputs.only_non_publishable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "Only non-publishable files changed; build and test skipped."

  require_version_bump:
    name: Require VERSION bump (same-repo PR)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        needs.changes.outputs.version_changed == 'true' ||
        needs.changes.outputs.has_publishable == 'true'
      ) &&
      !(
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        needs.changes.outputs.version_changed != 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "${BASE_REF}"

      - name: Require VERSION bump for publishable changes
        env:
          ARENA_VERSION_BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py

  master_merge_guard:
    name: Guard master publish path
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.has_ci_relevant == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      from_merged_pr: ${{ steps.guard.outputs.from_merged_pr }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: guard
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = data.some((pr) => pr.merged_at);
            core.setOutput("from_merged_pr", merged ? "true" : "false");
            if (!merged) {
              core.warning(
                "Direct push to master: full CI is required before publish. Open a pull request to use the fast publish path."
              );
            }

  verify:
    name: Verify (Ubuntu 24.04)
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.master_merge_guard.result == 'success' || needs.master_merge_guard.result == 'skipped') &&
      needs.changes.outputs.has_ci_relevant == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped' &&
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            needs.changes.outputs.version_changed != 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.master_merge_guard.outputs.from_merged_pr != 'true'
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Validate .codecov.yml
        run: |
          response=$(curl -s --data-binary @.codecov.yml https://codecov.io/validate)
          echo "$response"
          echo "$response" | grep -q "^Valid!" || { echo "::error::.codecov.yml failed Codecov schema validation"; exit 1; }

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: paths
        with:
          filters: |
            rust_crates:
              - 'Cargo.toml'
              - 'Cargo.Bazel.lock'
              - '**/Cargo.toml'
              - 'MODULE.bazel'
            version_file:
              - 'VERSION'
            deps:
              - 'Cargo.Bazel.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/requirements_lock.txt'
              - '**/requirements.txt'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Verify VERSION sync
        run: >-
          bazel test //scripts:version_sync_test //scripts:arena_version_test
          //scripts:check_version_bump_test //scripts:bump_patch_version_test
          //scripts:check_container_defaults_test
          //arena-container:default_images_test
          --config=ci

      - name: Check release lockfiles match VERSION
        if: steps.paths.outputs.version_file == 'true'
        run: python3 scripts/check_release_lockfiles.py

      - name: Verify lockfiles
        if: >-
          steps.paths.outputs.rust_crates == 'true' ||
          steps.paths.outputs.version_file == 'true'
        run: |
          CARGO_BAZEL_REPIN=1 bazel build //... --config=ci
          bazel mod deps --lockfile_mode=update
          if ! git diff --quiet Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock; then
            echo "Lockfiles are out of date. Run: CARGO_BAZEL_REPIN=1 bazel build //... && bazel mod deps --lockfile_mode=update"
            git diff Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock
            exit 1
          fi

      - name: Check dependency release age
        if: steps.paths.outputs.deps == 'true'
        env:
          ARENA_DEP_AGE_BASE_REF: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '')
            }}
        run: |
          bazel test //scripts:dependency_release_age_parse_test --config=ci
          bazel run //scripts:check_dependency_release_age --config=ci

  test_ubuntu_24_04:
    name: Test Ubuntu 24.04
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.master_merge_guard.result == 'success' || needs.master_merge_guard.result == 'skipped') &&
      needs.changes.outputs.has_ci_relevant == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped' &&
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            needs.changes.outputs.version_changed != 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.master_merge_guard.outputs.from_merged_pr != 'true'
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Build and test
        run: |
          bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test
          bazel test //... --config=ci --build_tests_only --test_tag_filters=component_test --local_test_jobs=4

  coverage_ubuntu_24_04:
    name: Coverage Ubuntu 24.04
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.master_merge_guard.result == 'success' || needs.master_merge_guard.result == 'skipped') &&
      needs.changes.outputs.has_ci_relevant == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped' &&
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            needs.changes.outputs.version_changed != 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Coverage
        run: |
          bazel coverage //... --config=coverage --build_tests_only --test_tag_filters=-component_test
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ubuntu-24.04
          name: arena-ubuntu-24.04
          fail_ci_if_error: false

  test_macos_intel:
    name: Test macOS Intel
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.master_merge_guard.result == 'success' || needs.master_merge_guard.result == 'skipped') &&
      needs.changes.outputs.has_ci_relevant == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped' &&
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            needs.changes.outputs.version_changed != 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.master_merge_guard.outputs.from_merged_pr != 'true'
        )
      )
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-intel
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test

  test_macos_arm64:
    name: Test macOS ARM64
    needs: [changes, master_merge_guard]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.master_merge_guard.result == 'success' || needs.master_merge_guard.result == 'skipped') &&
      needs.changes.outputs.has_ci_relevant == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          needs.master_merge_guard.result == 'skipped' &&
          !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            needs.changes.outputs.version_changed != 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.master_merge_guard.outputs.from_merged_pr != 'true'
        )
      )
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-arm64
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-component_test

  publish_gate:
    name: Publish gate
    needs:
      - changes
      - master_merge_guard
      - require_version_bump
      - verify
      - test_ubuntu_24_04
      - coverage_ubuntu_24_04
      - test_macos_intel
      - test_macos_arm64
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.has_publishable == 'true' &&
      needs.changes.outputs.version_changed == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.master_merge_guard.result == 'skipped' &&
          needs.require_version_bump.result == 'success' &&
          needs.verify.result == 'success' &&
          needs.test_ubuntu_24_04.result == 'success' &&
          needs.coverage_ubuntu_24_04.result == 'success' &&
          needs.test_macos_intel.result == 'success' &&
          needs.test_macos_arm64.result == 'success'
        ) ||
        (
          github.event_name == 'push' &&
          needs.master_merge_guard.result == 'success' &&
          needs.coverage_ubuntu_24_04.result == 'success' &&
          (
            needs.master_merge_guard.outputs.from_merged_pr == 'true' ||
            (
              needs.verify.result == 'success' &&
              needs.test_ubuntu_24_04.result == 'success' &&
              needs.test_macos_intel.result == 'success' &&
              needs.test_macos_arm64.result == 'success'
            )
          )
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "Ready to build release wheels."

  wheel:
    name: Build wheel (${{ matrix.runner }})
    needs: [changes, publish_gate]
    if: >-
      always() && !cancelled() &&
      needs.publish_gate.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: arena-pytest-wheel-ubuntu-24.04
            disk-cache: build-test-publish-arena-ubuntu-24.04
          - runner: macos-latest
            artifact: arena-pytest-wheel-macos-arm64
            disk-cache: build-test-publish-arena-macos-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.disk-cache }}
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib

          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          version_file = pathlib.Path("VERSION")
          base = version_file.read_text().strip()
          unique = f"{base}.dev{run_id}"
          version_file.write_text(unique + "\n")
          print(f"Patched VERSION to {unique} (TestPyPI)")
          PY

      - name: Build wheel
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:arena_pytest_wheel --config=ci
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish TestPyPI (Ubuntu 24.04)
    needs: wheel
    if: >-
      always() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.wheel.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish PyPI (Ubuntu 24.04)
    needs: [changes, wheel]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.version_changed == 'true' &&
      needs.wheel.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true

  publish_maven_snapshot:
    name: Publish Maven snapshot (Ubuntu 24.04)
    needs: [changes, publish_gate]
    if: >-
      always() && !cancelled() &&
      needs.publish_gate.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Publish snapshot to Maven Central
        env:
          MAVEN_REPO: https://central.sonatype.com/repository/maven-snapshots/
          MAVEN_USER: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: bazel run //arena-junit:arena_junit_maven_snapshot.publish --config=ci

  publish_maven_central:
    name: Publish Maven Central (Ubuntu 24.04)
    needs: [changes, publish_gate]
    if: >-
      always() && !cancelled() &&
      needs.publish_gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Build release artifacts
        run: |
          bazel build //arena-junit:arena_junit_maven //arena-junit:arena_junit_maven-lib \
            //arena-junit:arena_junit_maven-docs //arena-junit:arena_junit_maven-pom \
            //arena-junit:libarena_junit_maven-lib-src.jar \
            --config=ci

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign and publish release to Maven Central
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          bazel run //scripts:publish_maven_central --config=ci -- \
            "$PWD/bazel-bin/arena-junit/libarena_junit_maven-lib.jar" \
            "$PWD/bazel-bin/arena-junit/arena_junit_maven-pom.xml" \
            "$PWD/bazel-bin/arena-junit/libarena_junit_maven-lib-src.jar" \
            "$PWD/bazel-bin/arena-junit/arena_junit_maven-docs.jar"
