          path: arena-xunit/prebuilt/linux-x86-64

      - name: Download arena_ffi_shared (macOS ARM64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-darwin-aarch64
          path: arena-xunit/prebuilt/darwin-aarch64

      - name: Download arena_ffi_shared (macOS Intel)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-darwin-x86-64
          path: arena-xunit/prebuilt/darwin-x86-64

      - name: Download arena_ffi_shared (Windows x86-64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-windows-x86-64
          path: arena-xunit/prebuilt/windows-x86-64

      - name: Smoke test NuGet package
        shell: bash
        run: bazel run --config=ci --config=release --enable_runfiles //tools/predeploy_smoke/dotnet:nuget_snapshot_smoke_test

      - name: Smoke test Bazel consumer (csharp_import)
        shell: bash
        run: bazel test --config=ci --config=release --enable_runfiles //tools/predeploy_smoke/dotnet:bazel_consumer_smoke_test

  publish_nuget_snapshot:
    name: Publish NuGet snapshot (Ubuntu 24.04)
    needs: [changes, publish_gate, build_arena_ffi, nuget_smoke_test_cross_platform]
    if: >-
      always() && !cancelled() &&
      needs.publish_gate.result == 'success' &&
      needs.build_arena_ffi.result == 'success' &&
      needs.nuget_smoke_test_cross_platform.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "common:ci --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          else
            echo "common:ci --remote_cache=" >> .bazelrc.user
            echo "common:ci --bes_backend=" >> .bazelrc.user
          fi

      - name: Download arena_ffi_shared (Linux x86-64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-linux-x86-64
          path: arena-xunit/prebuilt/linux-x86-64

      - name: Download arena_ffi_shared (macOS ARM64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-darwin-aarch64
          path: arena-xunit/prebuilt/darwin-aarch64

      - name: Download arena_ffi_shared (macOS Intel)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-darwin-x86-64
          path: arena-xunit/prebuilt/darwin-x86-64

      - name: Download arena_ffi_shared (Windows x86-64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arena-ffi-windows-x86-64
          path: arena-xunit/prebuilt/windows-x86-64

      - name: Verify staged native libraries
        run: |
          test -s arena-xunit/prebuilt/linux-x86-64/libarena_ffi_shared.so
          test -s arena-xunit/prebuilt/darwin-aarch64/libarena_ffi_shared.dylib
          test -s arena-xunit/prebuilt/darwin-x86-64/libarena_ffi_shared.dylib
          test -s arena-xunit/prebuilt/windows-x86-64/arena_ffi_shared.dll

      - name: Build NuGet snapshot package
        run: |
          bazel build --config=ci --config=release --define=arena_xunit_prerelease=pr${PR_NUMBER}-${PR_SHA:0:7} \
            //arena-xunit:arena_xunit_nuget_snapshot

      - name: Smoke test NuGet snapshot package
        run: |
          bazel run --config=ci --config=release --define=arena_xunit_prerelease=pr${PR_NUMBER}-${PR_SHA:0:7} \
            //tools/predeploy_smoke/dotnet:nuget_snapshot_smoke_test

      - name: Smoke test Bazel consumer (csharp_import)
        run: bazel test --config=ci --config=release //tools/predeploy_smoke/dotnet:bazel_consumer_smoke_test

      - name: NuGet login (OIDC trusted publishing)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: rusty_dave

      - name: Build and push snapshot to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          bazel run --config=ci --config=release --define=arena_xunit_prerelease=pr${PR_NUMBER}-${PR_SHA:0:7} \
            //arena-xunit:arena_xunit_nuget_snapshot_push

  publish_nuget:
