name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, labeled]

jobs:
  bump_release_version:
    name: Bump release VERSION (PR)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch master
        run: git fetch origin master

      - name: Bump VERSION from master
        run: python3 scripts/bump_release_version.py

      - name: Commit release version
        run: |
          if git diff --quiet VERSION Cargo.toml MODULE.bazel; then
            echo "VERSION already set for this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION Cargo.toml MODULE.bazel
          git commit -m "chore: bump release VERSION for master"
          git push

  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.filter.outputs.bazel }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bazel:
              - '**/*'
              - '!**/*.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.cursor/**'

  docs_only:
    name: Docs / agent rules only
    needs: changes
    if: needs.changes.outputs.bazel != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo "No Bazel-relevant changes; build and test skipped."

  verify_cargo_bazel_lock:
    name: Verify Cargo.Bazel.lock (Ubuntu 24.04)
    needs: [changes, bump_release_version]
    if: >-
      always() &&
      needs.changes.outputs.bazel == 'true' &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: rust_crates
        with:
          filters: |
            rust_crates:
              - 'Cargo.toml'
              - 'Cargo.Bazel.lock'
              - '**/Cargo.toml'
              - 'MODULE.bazel'

      - name: Setup Bazel
        if: steps.rust_crates.outputs.rust_crates == 'true'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Verify VERSION sync
        if: steps.rust_crates.outputs.rust_crates == 'true'
        run: bazel test //scripts:version_sync_test --config=ci

      - name: Repin and verify lockfile
        if: steps.rust_crates.outputs.rust_crates == 'true'
        run: |
          CARGO_BAZEL_REPIN=1 bazel build //... --config=ci
          if ! git diff --quiet Cargo.Bazel.lock; then
            echo "Cargo.Bazel.lock is out of date. Run: CARGO_BAZEL_REPIN=1 bazel build //..."
            git diff Cargo.Bazel.lock
            exit 1
          fi

  test_ubuntu_24_04:
    name: Test Ubuntu 24.04
    needs: [changes, bump_release_version]
    if: >-
      needs.changes.outputs.bazel == 'true' &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only

  coverage_ubuntu_24_04:
    name: Coverage Ubuntu 24.04
    needs: [changes, bump_release_version]
    if: >-
      needs.changes.outputs.bazel == 'true' &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Coverage
        run: |
          bazel coverage //... --config=coverage --build_tests_only --test_tag_filters=-requires_docker
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: ubuntu-24.04
          name: arena-ubuntu-24.04
          fail_ci_if_error: false

  test_macos_intel:
    name: Test macOS Intel
    needs: [changes, bump_release_version]
    if: >-
      needs.changes.outputs.bazel == 'true' &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped')
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Colima
        uses: douglascamata/setup-docker-macos-action@v1.1.0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-intel
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only

  test_macos_arm64:
    name: Test macOS ARM64
    needs: [changes, bump_release_version]
    if: >-
      needs.changes.outputs.bazel == 'true' &&
      (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped')
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-macos-arm64
          repository-cache: true

      - name: Build and test
        run: bazel test //... --config=ci --build_tests_only --test_tag_filters=-requires_docker

  wheel:
    name: Build wheel (Ubuntu 24.04)
    needs: [changes, bump_release_version, test_ubuntu_24_04, test_macos_intel, test_macos_arm64]
    if: >-
      ${{
        needs.changes.outputs.bazel == 'true' &&
        (needs.bump_release_version.result == 'success' || needs.bump_release_version.result == 'skipped') &&
        (
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/master'
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib

          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          version_file = pathlib.Path("VERSION")
          base = version_file.read_text().strip()
          unique = f"{base}.dev{run_id}"
          version_file.write_text(unique + "\n")
          print(f"Patched VERSION to {unique} (TestPyPI)")
          PY

      - name: Build wheel
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:sync_version_before_wheel //arena-pytest:arena_pytest_wheel --config=ci
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-pytest-wheel-ubuntu-24.04
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish TestPyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish PyPI (Ubuntu 24.04)
    needs: wheel
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true
