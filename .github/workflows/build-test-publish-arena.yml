name: Build, test, publish arena

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-${{ matrix.os }}
          repository-cache: true

      - name: Build
        run: CARGO_BAZEL_REPIN=true bazel build //...

      - name: Run all tests
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: bazel test //... --test_output=all

      - name: Run tests (excluding Docker)
        if: runner.os == 'macOS'
        run: bazel test //... --test_tag_filters=-local --test_output=all

      - name: Unique version for TestPyPI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os, pathlib, re, tomllib

          # PyPI forbids local versions (+gabc123). Use PEP 440 dev release instead.
          run_id = os.environ.get("GITHUB_RUN_ID", "0")
          pyproject = pathlib.Path("arena-pytest/pyproject.toml")
          data = tomllib.loads(pyproject.read_text())
          base = data["project"]["version"]
          unique = f"{base}.dev{run_id}"
          text = pyproject.read_text()
          text = re.sub(
              r'^version = "[^"]+"',
              f'version = "{unique}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(text)
          build = pathlib.Path("arena-pytest/BUILD").read_text()
          build = re.sub(
              r'ARENA_PYTEST_VERSION = "[^"]+"',
              f'ARENA_PYTEST_VERSION = "{unique}"',
              build,
              count=1,
          )
          pathlib.Path("arena-pytest/BUILD").write_text(build)
          print(f"Patched arena-pytest version to {unique} (TestPyPI)")
          PY

      - name: Build wheel for TestPyPI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rm -f bazel-bin/arena-pytest/arena_pytest-*.whl
          bazel build //arena-pytest:arena_pytest_wheel
          rm -f bazel-bin/arena-pytest/arena_pytest-*-py3-none-any.whl || true
          ls -la bazel-bin/arena-pytest/*.whl

      - name: Upload wheel artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: arena-pytest-wheel-${{ matrix.os }}
          path: bazel-bin/arena-pytest/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish TestPyPI
    needs: build_and_test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arena-pytest-wheel-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
