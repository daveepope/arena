name: Dependabot relock

on:
  pull_request_target:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-relock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relock:
    name: Repin MODULE.bazel.lock
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: build-test-publish-arena-ubuntu-24.04
          repository-cache: true

      - name: Repin bzlmod lockfile
        run: bazel mod deps --lockfile_mode=update

      - name: Commit and push if changed
        run: |
          if git diff --quiet MODULE.bazel.lock; then
            echo "MODULE.bazel.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel.lock
          git commit -m "chore: repin MODULE.bazel.lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
