name: Dependabot version bump

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions: read-all

concurrency:
  group: dependabot-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump patch version
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "${BASE_REF}"

      - uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: dependabot-version-bump
          repository-cache: true
        env:
          ARENA_VERSION_BASE_REF: origin/${{ github.base_ref }}
          ARENA_BAZEL_CONFIG: ci
        run: |
          bazel run //scripts:bump_patch_version --config=ci
          bazel run //scripts:sync_version --config=ci

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Release files already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION Cargo.toml MODULE.bazel Cargo.Bazel.lock Cargo.lock MODULE.bazel.lock
          git commit -m "Bump patch version and sync release files"
          git push origin "HEAD:${HEAD_REF}"
