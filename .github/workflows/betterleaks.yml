name: Betterleaks secret scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"

permissions: read-all

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan working tree for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/betterleaks/betterleaks:latest \
            dir /repo --redact --no-banner --report-format sarif --report-path /repo/betterleaks-report.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: betterleaks-report.sarif
