[package]
name = "arena-dashboard"
version.workspace = true
edition = "2021"
authors = ["David Pope"]
description = "Language-agnostic live visualizer for a running Arena's lifecycle events"
license = "todo"

[dependencies]
arena = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
futures = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "stream"] }
runfiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "signal", "macros"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
