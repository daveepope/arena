[package]
name = "arena-oauth"
version.workspace = true
edition = "2021"
authors = ["David Pope"]
description = "Arena OAuth 2 authorization server dependency (HTTPS) for sandboxed environments"
license = "todo"

[dependencies]
arena = { workspace = true }
arena-container = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
axum-server = { workspace = true, default-features = false, features = ["tls-rustls"] }
futures = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rsa = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
env_logger = { workspace = true }
