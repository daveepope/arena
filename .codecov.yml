coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: 80%
        informational: true

flag_management:
  default_rules:
    paths:
      - "**"

ignore:
  - "bazel-*/**"
  - "external/**"
  - "third_party/**"
  - "tools/benches/**"
  - "tools/arena-ffi-bench/**"
  - "tools/predeploy_smoke/**"
