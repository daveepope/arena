[package]
name = "arena"
version = "0.1.0"
edition = "2021"
authors = ["David Pope"]
description = "The base Arena module containing contracts and core Arena behaviour."
license = "BSD-3-Clause"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"

[dev-dependencies]
mockall = "0.14.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }