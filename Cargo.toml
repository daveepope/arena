[workspace]
resolver = "2"
members = [
    "arena-postgres",
    "arena-mssql",
    "arena-oracledb",
    "arena",
    "arena-kafka",
    "arena-localstack",
    "arena-http",
    "arena-oauth",
    "arena-temporal",
    "arena-smtp",
    "arena-executable-component",
    "arena-container",
    "arena-cryptography",
    "arena-host",
    "arena-containerized-component",
    "arena-ffi",
    "tools/arena-ffi-bench",
    "examples"
]

[workspace.package]
version = "6.2.0"
[workspace.dependencies]
arena = { path = "arena" }
arena-kafka = { path = "arena-kafka" }
arena-localstack = { path = "arena-localstack" }
arena-postgres = { path = "arena-postgres" }
arena-mssql = { path = "arena-mssql" }
arena-oracledb = { path = "arena-oracledb" }
arena-temporal = { path = "arena-temporal" }
arena-smtp = { path = "arena-smtp" }
arena-executable-component = { path = "arena-executable-component" }
arena-http = { path = "arena-http" }
arena-oauth = { path = "arena-oauth" }
arena-container = { path = "arena-container" }
arena-cryptography = { path = "arena-cryptography" }
arena-host = { path = "arena-host" }
arena-containerized-component = { path = "arena-containerized-component" }
arena-ffi = { path = "arena-ffi" }
axum = "0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7.1"
tokio-postgres = "0.7.18"
postgres = "0.19"
rskafka = "0.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
backon = "1.5.2"
arc-swap = "1.7"
async-trait = "0.1"
futures = "0.3"
futures-timer = "3.0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
testcontainers-modules = "0.15.0"
tokio = "1"
tonic = "0.14.5"
tonic-health = "0.14.6"
tokio-stream = "0.1.18"
mockall = "0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rstest = "0.22"
bollard = "0.20"
docker_credential = "1.3"
ctor = "1.0"
tar = "0.4"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-credential-types = { version = "1" }
aws-smithy-types = { version = "1" }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
base64 = "0.23.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["use_pem", "rust_crypto"] }
rand = "0.10.1"
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
wiremock = "0.6.5"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
zip = { version = "8", default-features = false, features = ["deflate"] }