[workspace]
resolver = "2"
members = [
    "arena-postgres",
    "arena-mssql",
    "arena",
    "arena-kafka",
    "arena-localstack",
    "arena-http",
    "arena-executable-component",
    "arena-container",
    "arena-container-component",
    "arena-ffi",
    "examples"
]

[workspace.package]
version = "0.3.0-beta.1"

[workspace.dependencies]
arena = { path = "arena" }
arena-kafka = { path = "arena-kafka" }
arena-localstack = { path = "arena-localstack" }
arena-postgres = { path = "arena-postgres" }
arena-mssql = { path = "arena-mssql" }
arena-executable-component = { path = "arena-executable-component" }
arena-http = { path = "arena-http" }
arena-container = { path = "arena-container" }
arena-container-component = { path = "arena-container-component" }
axum = "0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
postgres = "0.19"
rdkafka = { version = "0.39.0" }
backon = "1.5.2"
async-trait = "0.1"
env_logger = "0.11"
futures = "0.3"
futures-timer = "3.0.3"
log = "0.4"
testcontainers-modules = "0.14.0"
tokio = "1"
mockall = "0.14.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rstest = "0.22"
bollard = "0.19"
tar = "0.4"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-credential-types = { version = "1" }
aws-smithy-types = { version = "1" }
zip = { version = "2", default-features = false, features = ["deflate"] }